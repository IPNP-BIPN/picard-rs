[package]
name = "picard-analysis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Port of Picard's analysis tools"

[dependencies]
htsjdk-bam.workspace = true
htsjdk-metrics.workspace = true
# Needed by the runnable binary, not only by the tests: reading a BAM means decompressing it.
htsjdk-bgzf.workspace = true

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib"] }
