[package]
name = "picard-analysis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Port of Picard's analysis tools"

[dependencies]
htsjdk-bam.workspace = true
htsjdk-metrics.workspace = true
# Needed by the runnable binary, not only by the tests: reading a BAM means decompressing it.
htsjdk-bgzf.workspace = true
jmath.workspace = true
# Multicore for the per-record transforms. The parallel map preserves order, so its output is
# byte-identical to the serial one; this is where the port beats single-threaded Picard/GATK.
rayon = "1"
# The sequence-dictionary M5 is an MD5 of the uppercased contig bases (SequenceUtil.calculateMD5).
md-5 = "0.10"

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib"] }
