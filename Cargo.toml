[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/IPNP-BIPN/picard-rs"

# htsjdk-rs is pinned by revision, mirroring how Picard's build.gradle pins
# htsjdkVersion = '5.0.0'. htsjdk-rs ports 4.2.0; the 5.0.0 behaviours Picard reaches are ported
# here (decision 0013). A floating dependency would let the I/O layer change under a
# byte-identity claim without anything failing.
[workspace.dependencies]
htsjdk-bam = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "e7f83cecf99b40e38f472c24015160953fea8053" }
htsjdk-bgzf = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "e7f83cecf99b40e38f472c24015160953fea8053" }
# CRAM, read and written as htsjdk 5.0.0 does: Picard 3.5.0 writes CRAM 3.1.
htsjdk-cram = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "e7f83cecf99b40e38f472c24015160953fea8053" }
htsjdk-metrics = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "e7f83cecf99b40e38f472c24015160953fea8053" }
htsjdk-vcf = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "e7f83cecf99b40e38f472c24015160953fea8053" }
# The `.idx` a VCF writer indexing on the fly puts beside its output.
htsjdk-tribble = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "e7f83cecf99b40e38f472c24015160953fea8053" }
# jmath, for the Math.log10 that QualityUtil.getPhredScoreFromObsAndErrors runs through, and for
# Math.round, which is not floor(x + 0.5): see htsjdk-rs PR 50.
jmath = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "e7f83cecf99b40e38f472c24015160953fea8053" }

# The published binaries: whole-program optimisation, because the hot paths cross from the tools
# into htsjdk-rs on every record and only fat LTO with one codegen unit lets those calls inline.
# Its own profile because it costs ~8 minutes per full build, and CI builds `release` in every job.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

