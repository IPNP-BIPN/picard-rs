[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/IPNP-BIPN/picard-rs"

# htsjdk-rs is pinned by revision, mirroring how Picard's build.gradle pins
# htsjdkVersion = '4.2.0'. A floating dependency would let the I/O layer change under a
# byte-identity claim without anything failing.
[workspace.dependencies]
htsjdk-bam = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "b15179743ed5abf955212a9c2dd75858b2e9967a" }
htsjdk-bgzf = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "b15179743ed5abf955212a9c2dd75858b2e9967a" }
htsjdk-metrics = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "b15179743ed5abf955212a9c2dd75858b2e9967a" }
htsjdk-vcf = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "b15179743ed5abf955212a9c2dd75858b2e9967a" }
# The `.idx` a VCF writer indexing on the fly puts beside its output.
htsjdk-tribble = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "b15179743ed5abf955212a9c2dd75858b2e9967a" }
# jmath, for the Math.log10 that QualityUtil.getPhredScoreFromObsAndErrors runs through, and for
# Math.round, which is not floor(x + 0.5): see htsjdk-rs PR 50.
jmath = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "b15179743ed5abf955212a9c2dd75858b2e9967a" }
