[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/IPNP-BIPN/picard-rs"

# htsjdk-rs is pinned by revision, mirroring how Picard's build.gradle pins
# htsjdkVersion = '4.2.0'. A floating dependency would let the I/O layer change under a
# byte-identity claim without anything failing.
[workspace.dependencies]
htsjdk-bam = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "868708e8b4ad3bc9479a14e1656dbda85df7fd93" }
htsjdk-bgzf = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "868708e8b4ad3bc9479a14e1656dbda85df7fd93" }
htsjdk-metrics = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "868708e8b4ad3bc9479a14e1656dbda85df7fd93" }
# jmath, for the Math.log10 that QualityUtil.getPhredScoreFromObsAndErrors runs through, and for
# Math.round, which is not floor(x + 0.5): see htsjdk-rs PR 50.
jmath = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "868708e8b4ad3bc9479a14e1656dbda85df7fd93" }
