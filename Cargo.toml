[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/IPNP-BIPN/picard-rs"

# htsjdk-rs is pinned by revision, mirroring how Picard's build.gradle pins
# htsjdkVersion = '4.2.0'. A floating dependency would let the I/O layer change under a
# byte-identity claim without anything failing.
[workspace.dependencies]
htsjdk-bam = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "c6c6f62ec5de54fc5bb67f1818793cc46863ae55" }
htsjdk-bgzf = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "c6c6f62ec5de54fc5bb67f1818793cc46863ae55" }
htsjdk-metrics = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "c6c6f62ec5de54fc5bb67f1818793cc46863ae55" }
# jmath, for the Math.log10 that QualityUtil.getPhredScoreFromObsAndErrors runs through.
jmath = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "c6c6f62ec5de54fc5bb67f1818793cc46863ae55" }
