name: gkl-bench

# A one-off measurement on a throwaway branch: GKL's C deflater against the gkl-deflate port, on
# real x86-64, same blocks, same level, digests compared.
on:
  push:
    branches: [bench/gkl-c-vs-port]

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host
        run: lscpu | grep -E 'Model name|Vendor ID'; grep -m1 flags /proc/cpuinfo | grep -o -w -E 'sse4_2|avx2|avx512f|pclmulqdq' | sort -u | tr '\n' ' '; echo; nproc
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Build the pinned oracle image
        run: docker build -t picard-rs-oracle:3.5.0 tools/oracle
      - name: Payload, 128 MiB of the benchmark BAM inflated
        run: |
          mkdir -p target/benchmark
          docker run --rm -v "$PWD/tools/benchmark":/harness:ro \
            -v "$PWD/target/benchmark":/out -w /work picard-rs-oracle:3.5.0 \
            'cp /harness/MakeBenchmarkBam.java . && javac -cp $PICARD_JAR -d . MakeBenchmarkBam.java \
             && java -cp .:$PICARD_JAR MakeBenchmarkBam 2000000 /out/bench'
          python3 -c "import gzip; d = gzip.decompress(open('target/benchmark/bench.bam','rb').read()); open('target/benchmark/raw.bin','wb').write(d[:128 << 20]); print(len(d))"
      - name: GKL, in the oracle container
        run: |
          docker run --rm -v "$PWD/tools/gkl-bench":/harness:ro -v "$PWD/target/benchmark":/out \
            -w /work picard-rs-oracle:3.5.0 \
            'cp /harness/GklDeflateBench.java . && javac -cp $PICARD_JAR -d . GklDeflateBench.java \
             && java -cp .:$PICARD_JAR GklDeflateBench /out/raw.bin 3 /out/htsjdk.bgzf' | tee target/benchmark/gkl.txt
      - name: The port, on the runner
        run: |
          cargo build --release --manifest-path tools/gkl-bench/port/Cargo.toml 2>&1 | tail -1
          tools/gkl-bench/port/target/release/gkl-port-bench target/benchmark/raw.bin 3 | tee target/benchmark/port.txt
      - name: Same bytes
        run: |
          a=$(awk '/^gkl_c/{print $NF}' target/benchmark/gkl.txt | sort -u)
          b=$(awk '/^port /{print $NF}' target/benchmark/port.txt | sort -u)
          echo "gkl $a"; echo "port $b"
          c=$(awk '/^htsjdk_bgzf/{print $NF}' target/benchmark/gkl.txt)
          d=$(awk '/^port_bgzf/{print $NF}' target/benchmark/port.txt)
          echo "htsjdk BGZF stream $c"; echo "port BGZF stream   $d"
          [ -n "$a" ] && [ "$a" = "$b" ] && echo "the raw blocks are the same bytes" || echo "the raw blocks differ"
          [ -n "$c" ] && [ "$c" = "$d" ] && echo "the BGZF streams are the same bytes" || echo "the BGZF streams differ"
          [ -n "$c" ] && [ "$c" = "$d" ]
