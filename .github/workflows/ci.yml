             && java -Duser.language=en -Duser.country=US -cp ".:$ORACLE_CP" SnvqDump 2>/dev/null' > /tmp/snvq_real.txt
          wc -l /tmp/snvq_real.txt

      - name: Compare the SNVQ goldens against the committed corpus
        # Only the metrics body is comparable; the sam row is deterministic (hand-built reads) and
