name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: LICENSE and README state the same licence
        # picard-rs is MIT because Picard is MIT. gatk-rs is Apache 2.0. Getting these crossed
        # is easy and consequential, so it is checked rather than remembered.
        run: |
          grep -q "MIT License" LICENSE || { echo "LICENSE is not MIT"; exit 1; }
          grep -q "MIT, matching Picard" README.md || { echo "README licence claim changed"; exit 1; }
          grep -qi "not the official Picard" README.md || { echo "attribution notice missing"; exit 1; }
          echo "licence and attribution consistent"

      - name: Goldens live in exactly one place
        # They were committed twice, under tools/metrics-conformance/ and under the crate's
        # tests/data/, with nothing keeping the two in sync. A corpus that exists twice is a
        # corpus that can disagree with itself, and the CI comparison would have kept passing
        # against the stale copy.
        run: |
          strays=$(ls tools/metrics-conformance/*.txt.gz 2>/dev/null || true)
          if [ -n "$strays" ]; then
            echo "goldens duplicated outside crates/picard-analysis/tests/data:"
            echo "$strays"
            exit 1
          fi
          echo "one copy of each golden"

      - name: The workflow matches the conformance manifest
        # The oracle jobs are generated from tools/conformance/manifest.json. Editing the YAML by
        # hand is how the old file grew to 1556 lines of drifted copies of one comparator, so a
        # hand edit fails here instead of surviving unnoticed.
        run: python3 tools/conformance/generate_ci.py --check

      - name: No merge conflict survived into a tracked file
        # A conflicted `tools/coverage/fixtures.json` was committed and merged: nothing parses that
        # file in CI -- the arrays are generated from it beforehand and committed -- so the markers
        # rode all the way to main. Two lines here would have caught it.
        run: |
          if git grep -Iln -e '^<<<<<<< ' -e '^>>>>>>> ' -- . ':!*.md' ; then
            echo "a conflict marker is committed above"
            exit 1
          fi
          python3 -c "import json; json.load(open('tools/coverage/fixtures.json'))"
          python3 -c "import json; json.load(open('tools/conformance/manifest.json'))"
          echo "no conflict markers, and the two JSON files parse"

      - name: Every committed golden belongs to a declared suite
        # A golden that no suite regenerates is a golden nothing checks: it can only ever be
        # compared against itself. Thirteen of them were in exactly that state before the manifest
        # existed (docs/decisions/0008), so the condition is now an invariant rather than a habit.
        run: python3 tools/conformance/audit_goldens.py

      - name: The option table is the one the header-lines golden records
        # `tool_options.rs` is generated from the golden's decl rows, and the command line every
        # metrics file and @PG carries is built from it, so an edit by hand or a re-frozen golden
        # left ungenerated would change those lines with nothing else failing first.
        run: python3 tools/headerlines-conformance/generate.py --check

  determinism:
    name: "Determinism: same input, different environment"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: nasm, which gkl-igzip needs to build
        # The htsjdk-bgzf `gkl-igzip` feature assembles ISA-L, so every job that compiles the
        # workspace needs an assembler; see the deflater job for why the feature stays on.
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete; the install below is the gate"
          sudo apt-get install -y -qq nasm
          nasm -v

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build the pinned oracle image
        run: docker build --platform linux/amd64 -t picard-rs-oracle:3.5.0 tools/oracle

      - run: cargo build --release --bin CollectAlignmentSummaryMetrics --bin AddOATag

      - name: Build the fixture corpus
        run: |
          mkdir -p target/fixtures
          docker run --rm --platform linux/amd64 -v "$PWD/tools/coverage":/harness:ro \
            -v "$PWD/target/fixtures":/out -w /work picard-rs-oracle:3.5.0 \
            'cp /harness/*.java . && javac -cp "$ORACLE_CP" -d . *.java \
             && java -Dsamjdk.try_use_intel_deflater=false -Dsamjdk.use_libdeflate=false -cp ".:$ORACLE_CP" MakeFixtures /out'

      - name: The same input twice, under three environments, is the same bytes
        # A byte-identity claim that only holds in one environment is not a byte-identity claim.
        # LC_ALL is the interesting one: htsjdk-rs decision 0011 established that metrics number
        # formatting is locale-dependent in the reference, and the oracle pins en_US for that
        # reason. The port must not have acquired the same dependency, so it is run under fr_FR,
        # where a locale-sensitive formatter would write "0,333333".
        run: |
          set -eux
          B=target/release/CollectAlignmentSummaryMetrics
          F=target/fixtures
          $B I=$F/small.bam O=/tmp/run1.txt R=$F/ref.fasta
          $B I=$F/small.bam O=/tmp/run2.txt R=$F/ref.fasta
          TMPDIR=/tmp/other-tmp LC_ALL=fr_FR.UTF-8 $B I=$F/small.bam O=/tmp/run3.txt R=$F/ref.fasta
          mkdir -p /tmp/other-tmp
          JAVA_TOOL_OPTIONS=-Xmx256m $B I=$F/small.bam O=/tmp/run4.txt R=$F/ref.fasta
          for f in /tmp/run2.txt /tmp/run3.txt /tmp/run4.txt; do
            diff <(grep -v '^# ' /tmp/run1.txt) <(grep -v '^# ' $f) \
              || { echo "the port is not deterministic across environments: $f"; exit 1; }
          done
          echo "four runs, three environments, identical"

  deflater:
    name: "COMPRESSION_LEVEL and USE_JDK_DEFLATER: the BAM Picard writes, byte for byte"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: nasm, which is what makes GKL's igzip exact rather than merely valid
        # GKL routes levels 0 to 2 through ISA-L igzip. Without an assembler ISA-L falls back to
        # its readable C, which is valid deflate but not GKL's, and `gkl-deflate` refuses those
        # levels rather than guess. The refresh may fail on a third-party apt source; the install
        # is the gate.
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete; the install below is the gate"
          sudo apt-get install -y -qq nasm
          nasm -v

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build the pinned oracle image
        run: docker build --platform linux/amd64 -t picard-rs-oracle:3.5.0 tools/oracle

      - run: cargo build --release --bin SortSam --bin AddCommentsToBam --bin GatherBamFiles

      - name: Build the fixture corpus
        run: |
          mkdir -p target/fixtures
          docker run --rm --platform linux/amd64 -v "$PWD/tools/coverage":/harness:ro \
            -v "$PWD/target/fixtures":/out -w /work picard-rs-oracle:3.5.0 \
            'cp /harness/*.java . && javac -cp "$ORACLE_CP" -d . *.java \
             && java -Dsamjdk.try_use_intel_deflater=false -Dsamjdk.use_libdeflate=false -cp ".:$ORACLE_CP" MakeFixtures /out'

      - name: The same command line writes the same bytes, at every level and with either deflater
        # Picard's CommandLineProgram installs Intel's GKL unless USE_JDK_DEFLATER=true, and sets
        # every BGZF writer's level from COMPRESSION_LEVEL. With USE_JDK_DEFLATER htsjdk 5 picks
        # libdeflate. The whole file is compared, framing included, so this is the deflater and the
        # level and nothing else. SortSam writes through the BAM writer, AddCommentsToBam through
        # the block-copy reheader and GatherBamFiles through the gather, which re-compress only the
        # blocks they rewrite. Both sides run from the same directory layout, so a row's arguments
        # are the same words on each; AddCommentsToBam refuses an input it cannot write, so it is
        # given a copy.
        run: |
          set -eu
          mkdir -p target/deflater
          cp target/fixtures/small.bam target/deflater/comments_in.bam
          F=fixtures
          rows=(
            "sort|SortSam|I=$F/queryname.bam SORT_ORDER=coordinate"
            "sort_l0|SortSam|I=$F/queryname.bam SORT_ORDER=coordinate COMPRESSION_LEVEL=0"
            "sort_l1|SortSam|I=$F/queryname.bam SORT_ORDER=coordinate COMPRESSION_LEVEL=1"
            "sort_l2|SortSam|I=$F/queryname.bam SORT_ORDER=coordinate COMPRESSION_LEVEL=2"
            "sort_l3|SortSam|I=$F/queryname.bam SORT_ORDER=coordinate COMPRESSION_LEVEL=3"
            "sort_l9|SortSam|I=$F/queryname.bam SORT_ORDER=coordinate COMPRESSION_LEVEL=9"
            "sort_jdk|SortSam|I=$F/queryname.bam SORT_ORDER=coordinate USE_JDK_DEFLATER=true"
            "sort_jdk1|SortSam|I=$F/queryname.bam SORT_ORDER=coordinate USE_JDK_DEFLATER=true COMPRESSION_LEVEL=1"
            "sort_jdk9|SortSam|I=$F/queryname.bam SORT_ORDER=coordinate USE_JDK_DEFLATER=true COMPRESSION_LEVEL=9"
            "comments|AddCommentsToBam|I=deflater/comments_in.bam C=one C=two"
            "comments_jdk|AddCommentsToBam|I=deflater/comments_in.bam C=one USE_JDK_DEFLATER=true COMPRESSION_LEVEL=2"
            "gather|GatherBamFiles|I=$F/small.bam I=$F/small.bam"
            "gather_jdk|GatherBamFiles|I=$F/small.bam I=$F/small.bam USE_JDK_DEFLATER=true COMPRESSION_LEVEL=7"
          )
          script="cd /work"
          for row in "${rows[@]}"; do
            IFS="|" read -r name tool args <<< "$row"
            script+=" && java -jar \$PICARD_JAR $tool $args O=deflater/picard_$name.bam >/dev/null 2>&1"
            (cd target && "release/$tool" $args O=deflater/port_$name.bam) \
              || echo "the port refused $name"
          done
          docker run --rm --platform linux/amd64 -v "$PWD/target/fixtures":/work/fixtures:ro \
            -v "$PWD/target/deflater":/work/deflater picard-rs-oracle:3.5.0 "$script"
          failed=0
          for row in "${rows[@]}"; do
            name="${row%%|*}"
            test -s "target/deflater/picard_$name.bam" || { echo "Picard wrote nothing for $name"; failed=1; continue; }
            test -s "target/deflater/port_$name.bam" || { echo "the port wrote nothing for $name"; failed=1; continue; }
            if cmp -s "target/deflater/picard_$name.bam" "target/deflater/port_$name.bam"; then
              echo "$name: identical"
            else
              echo "$name: DIFFERS"; failed=1
            fi
          done
          exit $failed

  fuzz:
    name: "Coverage-guided fuzzing of the reference"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: nasm, which gkl-igzip needs to build
        # The htsjdk-bgzf `gkl-igzip` feature assembles ISA-L, so every job that compiles the
        # workspace needs an assembler; see the deflater job for why the feature stays on.
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete; the install below is the gate"
          sudo apt-get install -y -qq nasm
          nasm -v

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build the pinned oracle image
        run: docker build --platform linux/amd64 -t picard-rs-oracle:3.5.0 tools/oracle

      - run: cargo build --release --bin CollectAlignmentSummaryMetrics

      - name: Fuzz, seeded from the covering array, and replay against the port
        # The covering arrays cover interactions between arguments; they say nothing about which
        # branches of the reference those interactions reach. This starts from the array's rows and
        # keeps whatever reaches a probe nothing has reached. A short session on every run, because
        # the value is the regression signal (a divergence class that disappears, or a new one that
        # appears), not the depth of any single run.
        run: |
          python3 tools/fuzz/run_fuzz.py --tool CollectQualityYieldMetrics --iterations 60
          python3 tools/fuzz/run_fuzz.py --tool CollectAlignmentSummaryMetrics --iterations 60 \
            --port target/release/CollectAlignmentSummaryMetrics

      - name: Publish the findings
        # Findings are evidence, not goldens: they say what the reference did and where the port
        # differs. They are published rather than committed, because a finding produced anywhere
        # other than real x86-64 CI cannot be quoted (decision 0008).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: tools/fuzz/findings/
          if-no-files-found: ignore

  coverage:
    name: "Argument coverage: the covering array against both sides"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: nasm, which gkl-igzip needs to build
        # The htsjdk-bgzf `gkl-igzip` feature assembles ISA-L, so every job that compiles the
        # workspace needs an assembler; see the deflater job for why the feature stays on.
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete; the install below is the gate"
          sudo apt-get install -y -qq nasm
          nasm -v

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build the pinned oracle image
        run: docker build --platform linux/amd64 -t picard-rs-oracle:3.5.0 tools/oracle

      - run: cargo build --release --bin AddOATag --bin CollectAlignmentSummaryMetrics --bin CollectQualityYieldMetrics --bin SortSam --bin CleanSam --bin SamFormatConverter --bin BedToIntervalList --bin IntervalListToBed --bin NormalizeFasta --bin AddOrReplaceReadGroups --bin MergeSamFiles --bin ReplaceSamHeader --bin CalculateReadGroupChecksum --bin NonNFastaSize --bin ScatterIntervalsByNs --bin ViewSam --bin BamIndexStats --bin ReorderSam --bin CreateSequenceDictionary --bin DownsampleSam --bin FixMateInformation --bin MeanQualityByCycle --bin CollectBaseDistributionByCycle --bin QualityScoreDistribution --bin SetNmMdAndUqTags --bin RevertSam --bin ExtractSequences --bin IntervalListTools --bin PositionBasedDownsampleSam --bin ValidateSamFile --bin FilterSamReads --bin MarkDuplicates --bin FastqToSam --bin SplitSamByNumberOfReads --bin SplitSamByLibrary --bin MakeVcfSampleNameMap --bin SamToFastq --bin CollectDuplicateMetrics --bin MarkDuplicatesWithMateCigar --bin SimpleMarkDuplicatesWithMateCigar --bin CheckDuplicateMarking --bin AccumulateQualityYieldMetrics --bin GenotypeConcordance --bin EstimateLibraryComplexity --bin CollectUmiPrevalenceMetrics --bin RevertOriginalBaseQualitiesAndAddMateCigar --bin CollectVariantCallingMetrics --bin CollectJumpingLibraryMetrics --bin MarkIlluminaAdapters --bin SamToFastqWithTags --bin FindMendelianViolations --bin LiftOverIntervalList --bin CompareSAMs --bin CollectInsertSizeMetrics --bin BuildBamIndex --bin AddCommentsToBam --bin GatherBamFiles --bin LiftOverHaplotypeMap --bin MakeSitesOnlyVcf --bin RenameSampleInVcf --bin VcfToIntervalList --bin SortVcf --bin UpdateVcfSequenceDictionary --bin MergeVcfs --bin GatherVcfs --bin SplitVcfs --bin VcfFormatConverter --bin FixVcfHeader --bin CollectWgsMetrics --bin CollectRawWgsMetrics --bin CollectWgsMetricsWithNonZeroCoverage --bin CollectHsMetrics --bin CollectTargetedPcrMetrics --bin CollectSequencingArtifactMetrics --bin ConvertSequencingArtifactToOxoG --bin CollectOxoGMetrics --bin CollectGcBiasMetrics --bin CollectRrbsMetrics --bin CollectRnaSeqMetrics --bin CollectIndependentReplicateMetrics --bin LiftoverVcf --bin CollectMultipleMetrics --bin SortGff --bin MergePedIntoVcf --bin BamToBfq --bin CompareMetrics --bin MergeBamAlignment --bin CollectSamErrorMetrics --bin AccumulateVariantCallingMetrics --bin BaitDesigner --bin CollectQualityYieldMetricsFlow --bin CollectQualityYieldMetricsSNVQ --bin FifoBuffer --bin UmiAwareMarkDuplicatesWithMateCigar --bin ConvertHaplotypeDatabaseToVcf --bin ClusterCrosscheckMetrics --bin SetNmAndUqTags --bin CheckTerminatorBlock --bin FilterVcf --bin CheckFingerprint --bin CrosscheckFingerprints --bin CrosscheckReadGroupFingerprints --bin CalculateFingerprintMetrics --bin ExtractFingerprint --bin IdentifyContaminant --bin CreateBafRegressMetricsFile --bin CreateVerifyIDIntensityContaminationMetricsFile --bin BpmToNormalizationManifestCsv --bin CompareGtcFiles --bin GtcToVcf --bin VcfToAdpc --bin CombineGenotypingArrayVcfs --bin CollectArraysVariantCallingMetrics --bin CreateExtendedIlluminaManifest --bin CheckIlluminaDirectory --bin CollectIlluminaLaneMetrics --bin CollectHiSeqXPfFailMetrics --bin CollectIlluminaBasecallingMetrics --bin ExtractIlluminaBarcodes --bin IlluminaBasecallsToFastq --bin IlluminaBasecallsToSam

      - name: Build the corpus once, for every array to share
        # `MakeFixtures` is deterministic, so one build is every array's corpus. Building it per
        # array is a container run each time, which is most of this job's wall clock once there
        # are forty of them.
        run: python3 tools/coverage/run_array.py --build-fixtures /tmp/corpus

      - name: Run the arrays, and record what the port covers
        # Every row goes through the reference and through the port, compared under the same
        # canonicalization the conformance suites use. A rejected row counts as covered when both
        # sides reject it with the same message, because reproducing a refusal is reproducing the
        # tool.
        #
        # The number that comes out is not a bug count. It is how much of the pairwise argument
        # surface the port implements, which is the figure the programme had never had until this
        # job ran: a binary written for one path answers a row that varies another path
        # differently, and that difference is the measurement, not a failure.
        run: |
          python3 tools/coverage/run_array.py --tool AddOATag --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/AddOATag \
            | tee /tmp/AddOATag.log
          python3 tools/coverage/run_array.py --tool CollectAlignmentSummaryMetrics --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/CollectAlignmentSummaryMetrics \
            | tee /tmp/CollectAlignmentSummaryMetrics.log
          python3 tools/coverage/run_array.py --tool CollectQualityYieldMetrics --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/CollectQualityYieldMetrics \
            | tee /tmp/CollectQualityYieldMetrics.log
          python3 tools/coverage/run_array.py --tool SortSam --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/SortSam \
            | tee /tmp/SortSam.log
          python3 tools/coverage/run_array.py --tool CleanSam --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/CleanSam \
            | tee /tmp/CleanSam.log
          python3 tools/coverage/run_array.py --tool SamFormatConverter --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/SamFormatConverter \
            | tee /tmp/SamFormatConverter.log
          python3 tools/coverage/run_array.py --tool BedToIntervalList --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/BedToIntervalList \
            | tee /tmp/BedToIntervalList.log
          python3 tools/coverage/run_array.py --tool IntervalListToBed --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/IntervalListToBed \
            | tee /tmp/IntervalListToBed.log
          python3 tools/coverage/run_array.py --tool NormalizeFasta --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/NormalizeFasta \
            | tee /tmp/NormalizeFasta.log
          python3 tools/coverage/run_array.py --tool AddOrReplaceReadGroups --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/AddOrReplaceReadGroups \
            | tee /tmp/AddOrReplaceReadGroups.log
          python3 tools/coverage/run_array.py --tool MergeSamFiles --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/MergeSamFiles \
            | tee /tmp/MergeSamFiles.log
          python3 tools/coverage/run_array.py --tool ReplaceSamHeader --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/ReplaceSamHeader \
            | tee /tmp/ReplaceSamHeader.log
          python3 tools/coverage/run_array.py --tool CalculateReadGroupChecksum --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/CalculateReadGroupChecksum \
            | tee /tmp/CalculateReadGroupChecksum.log
          python3 tools/coverage/run_array.py --tool NonNFastaSize --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/NonNFastaSize \
            | tee /tmp/NonNFastaSize.log
          python3 tools/coverage/run_array.py --tool ScatterIntervalsByNs --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/ScatterIntervalsByNs \
            | tee /tmp/ScatterIntervalsByNs.log
          python3 tools/coverage/run_array.py --tool ViewSam --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/ViewSam --stdout \
            | tee /tmp/ViewSam.log
          python3 tools/coverage/run_array.py --tool BamIndexStats --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/BamIndexStats --stdout \
            | tee /tmp/BamIndexStats.log
          python3 tools/coverage/run_array.py --tool ReorderSam --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/ReorderSam \
            | tee /tmp/ReorderSam.log
          python3 tools/coverage/run_array.py --tool CreateSequenceDictionary --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/CreateSequenceDictionary \
            | tee /tmp/CreateSequenceDictionary.log
          python3 tools/coverage/run_array.py --tool DownsampleSam --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/DownsampleSam --strip-program-records --output-name output.txt,metrics.txt \
            | tee /tmp/DownsampleSam.log
          python3 tools/coverage/run_array.py --tool FixMateInformation --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/FixMateInformation \
            | tee /tmp/FixMateInformation.log
          python3 tools/coverage/run_array.py --tool MeanQualityByCycle --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/MeanQualityByCycle \
            | tee /tmp/MeanQualityByCycle.log
          python3 tools/coverage/run_array.py --tool CollectBaseDistributionByCycle --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/CollectBaseDistributionByCycle \
            | tee /tmp/CollectBaseDistributionByCycle.log
          python3 tools/coverage/run_array.py --tool QualityScoreDistribution --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/QualityScoreDistribution \
            | tee /tmp/QualityScoreDistribution.log
          python3 tools/coverage/run_array.py --tool SetNmMdAndUqTags --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/SetNmMdAndUqTags \
            | tee /tmp/SetNmMdAndUqTags.log
          python3 tools/coverage/run_array.py --tool RevertSam --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/RevertSam --output-name output.txt,rg1.bam,rg2.bam,rg1.sam,rg2.sam,rg1.cram,rg2.cram,mapped_rg1.bam,mapped_rg2.sam \
            | tee /tmp/RevertSam.log
          python3 tools/coverage/run_array.py --tool ExtractSequences --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/ExtractSequences \
            | tee /tmp/ExtractSequences.log
          python3 tools/coverage/run_array.py --tool IntervalListTools --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/IntervalListTools --strip-program-records --output-name @all \
            | tee /tmp/IntervalListTools.log
          python3 tools/coverage/run_array.py --tool PositionBasedDownsampleSam --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/PositionBasedDownsampleSam --strip-program-records \
            | tee /tmp/PositionBasedDownsampleSam.log
          python3 tools/coverage/run_array.py --tool ValidateSamFile --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/ValidateSamFile --exit-code-is-a-result \
            | tee /tmp/ValidateSamFile.log
          python3 tools/coverage/run_array.py --tool FilterSamReads --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/FilterSamReads \
            | tee /tmp/FilterSamReads.log
          python3 tools/coverage/run_array.py --tool MarkDuplicates --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/MarkDuplicates --strip-program-records --output-name output.txt,metrics.txt,metrics_b.txt \
            | tee /tmp/MarkDuplicates.log
          python3 tools/coverage/run_array.py --tool FastqToSam --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/FastqToSam \
            | tee /tmp/FastqToSam.log
          python3 tools/coverage/run_array.py --tool SplitSamByNumberOfReads --t 2 \
            --fixtures-dir /tmp/corpus \
            --port target/release/SplitSamByNumberOfReads --output-name shard_0001.bam,shard_0002.bam,shard_0003.bam,shard_0004.bam,shard_0005.bam,shard_0001.sam,shard_0002.sam,shard_0003.sam,shard_0004.sam,shard_0005.sam,part_0001.bam,part_0002.bam,part_0003.bam,part_0004.bam,part_0005.bam,part_0001.sam,part_0002.sam,part_0003.sam,part_0004.sam,part_0005.sam \
            | tee /tmp/SplitSamByNumberOfReads.log
          python3 tools/coverage/run_array.py --tool SplitSamByLibrary --t 2 \
