name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LICENSE and README state the same licence
        # picard-rs is MIT because Picard is MIT. gatk-rs is Apache 2.0. Getting these crossed
        # is easy and consequential, so it is checked rather than remembered.
        run: |
          grep -q "MIT License" LICENSE || { echo "LICENSE is not MIT"; exit 1; }
          grep -q "MIT, matching Picard" README.md || { echo "README licence claim changed"; exit 1; }
          grep -qi "not the official Picard" README.md || { echo "attribution notice missing"; exit 1; }
          echo "licence and attribution consistent"

      - name: Goldens live in exactly one place
        # They were committed twice, under tools/metrics-conformance/ and under the crate's
        # tests/data/, with nothing keeping the two in sync. A corpus that exists twice is a
        # corpus that can disagree with itself, and the CI comparison would have kept passing
        # against the stale copy.
        run: |
          strays=$(ls tools/metrics-conformance/*.txt.gz 2>/dev/null || true)
          if [ -n "$strays" ]; then
            echo "goldens duplicated outside crates/picard-analysis/tests/data:"
            echo "$strays"
            exit 1
          fi
          echo "one copy of each golden"

  test:
    name: Test on real x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Every ported symbol comes from a licence-compatible source
        # htsjdk-rs decision 0014: a transcription of GPL2-only HotSpot source was published in
        # an MIT crate and found eleven commits later by reading module headers. The same guard
        # runs here before picard-rs ports a symbol whose source is not obviously in the pinned
        # clones.
        run: python3 tools/audit/provenance.py crates

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

      - name: htsjdk-rs is pinned by revision, not by branch
        # Picard's build.gradle pins htsjdkVersion. A floating dependency would let the I/O
        # layer change under a byte-identity claim without anything failing.
        run: |
          if grep -E 'htsjdk-[a-z]+ = \{ git' Cargo.toml | grep -qv 'rev = "'; then
            echo "an htsjdk-rs dependency is not pinned to a revision"
            exit 1
          fi
          grep -c 'rev = "' Cargo.toml

  oracle:
    name: Regenerate the metrics goldens on real x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the host CPU
        run: grep -m1 'model name' /proc/cpuinfo; grep -m1 'vendor_id' /proc/cpuinfo

      - name: Build the oracle image
        # The probe runs during the build, so a degraded environment cannot produce an image.
        run: docker build --platform linux/amd64 -t picard-rs-oracle:3.4.0 tools/oracle

      - name: Regenerate the CollectQualityYieldMetrics goldens
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/tools/metrics-conformance":/harness:ro -w /work picard-rs-oracle:3.4.0 \
            'cp /harness/QualityYieldDump.java . && javac -cp "$ORACLE_CP" -d . QualityYieldDump.java \
             && java -cp ".:$ORACLE_CP" QualityYieldDump 2>/dev/null' > /tmp/qy_real.txt
          wc -l /tmp/qy_real.txt

      - name: Regenerate the CollectInsertSizeMetrics goldens
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/tools/metrics-conformance":/harness:ro -w /work picard-rs-oracle:3.4.0 \
            'cp /harness/InsertSizeDump.java . && javac -cp "$ORACLE_CP" -d . InsertSizeDump.java \
             && java -cp ".:$ORACLE_CP" InsertSizeDump 2>/dev/null' > /tmp/is_real.txt
          wc -l /tmp/is_real.txt

      - name: Regenerate the cycle-collector goldens
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/tools/metrics-conformance":/harness:ro -w /work picard-rs-oracle:3.4.0 \
            'cp /harness/CycleDump.java . && javac -cp "$ORACLE_CP" -d . CycleDump.java \
             && java -cp ".:$ORACLE_CP" CycleDump 2>/dev/null' > /tmp/cy_real.txt
          wc -l /tmp/cy_real.txt

      - name: Regenerate the CollectAlignmentSummaryMetrics goldens
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/tools/metrics-conformance":/harness:ro -w /work picard-rs-oracle:3.4.0 \
            'cp /harness/AlignmentSummaryDump.java . && javac -cp "$ORACLE_CP" -d . AlignmentSummaryDump.java \
             && java -cp ".:$ORACLE_CP" AlignmentSummaryDump 2>/dev/null' > /tmp/asm_real.txt
          wc -l /tmp/asm_real.txt

      - name: Compare the metrics rows against the committed goldens
        # The BAM hex and the two header lines carry JVM-chosen temp paths and a timestamp, so
        # only the metrics body is comparable across runs. That is stated rather than left
        # implicit, because a comparison that quietly ignores most of a file is worthless.
        run: |
          python3 - <<'PY'
          import sys, gzip

          # Every tool whose command-line header must be stripped. One list, applied to every
          # file, because a multi-tool harness emits more than one of them and stripping only
          # the prefix of the "current" tool leaves the others' temp paths in place. That bug
          # made CI report 14 mismatches that were not divergences at all.
          TOOL_PREFIXES = [
              '# CollectQualityYieldMetrics',
              '# CollectInsertSizeMetrics',
              '# MeanQualityByCycle',
              '# CollectBaseDistributionByCycle',
              '# CollectAlignmentSummaryMetrics',
              '# Started on:',
          ]

          def body(text):
              keep = [l for l in text.split('\\n')
                      if not any(l.startswith(p) for p in TOOL_PREFIXES)]
              return '\\n'.join(keep)

          def parse(path, open_fn=open):
              d = {}
              for line in open_fn(path):
                  parts = line.rstrip('\n').split('\t', 2)
                  # 'metrics' for the single-tool harnesses, the tool name for the multi-tool
                  # one. The 'bam' and 'fasta' lines are inputs, not output: the Rust tests
                  # compare those.
                  if len(parts) < 3 or parts[0] in ('bam', 'fasta'):
                      continue
                  d[(parts[0], parts[1])] = body(parts[2])
              return d

          # One path per corpus, and it is the path the Rust tests read. The goldens used to
          # sit in tools/metrics-conformance/ as well, two copies with nothing keeping them in
          # sync; the invariants job now fails if that comes back.
          pairs = [
              ('/tmp/qy_real.txt', 'crates/picard-analysis/tests/data/quality_yield.txt.gz'),
              ('/tmp/is_real.txt', 'crates/picard-analysis/tests/data/insert_size.txt.gz'),
              ('/tmp/cy_real.txt', 'crates/picard-analysis/tests/data/cycle.txt.gz'),
              ('/tmp/asm_real.txt', 'crates/picard-analysis/tests/data/alignment_summary.txt.gz'),
          ]
          bad, total = [], 0
          for real_path, committed_path in pairs:
              real = parse(real_path)
              committed = parse(committed_path, lambda p: gzip.open(p, 'rt'))
              if set(real) != set(committed):
                  print(f"case sets differ in {real_path}: {sorted(set(real) ^ set(committed))}")
                  sys.exit(1)
              total += len(real)
              for k in real:
                  if real[k] != committed[k]:
                      bad.append((real_path, k, real[k], committed[k]))
          print(f"compared={total} mismatches={len(bad)}")
          for path, k, r, c in bad[:5]:
              print(f"  {path} {k}\n    real={r[:200]}\n    committed={c[:200]}")
          sys.exit(1 if bad else 0)
          PY

      - name: Regenerate the CollectRnaSeqMetrics goldens
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/tools/rnaseq-conformance":/harness:ro -w /work picard-rs-oracle:3.4.0 \
            'cp /harness/RnaSeqMetricsDump.java . && javac -cp "$ORACLE_CP" -d . RnaSeqMetricsDump.java \
             && java -Duser.language=en -Duser.country=US -cp ".:$ORACLE_CP" RnaSeqMetricsDump 2>/dev/null' > /tmp/rnaseq_real.txt
          wc -l /tmp/rnaseq_real.txt

      - name: Compare the RnaSeqMetrics goldens against the committed corpus
        # Only the metrics body is comparable: the command-line header carries JVM temp paths and
        # the Started-on line a timestamp. The sam/refflat/ribosomal input rows are compared raw,
        # since a fixed seed and fixed content make them reproducible; a drift there would change
        # what the Rust test parses.
        run: |
          python3 - <<'PY'
          import sys, gzip
          PREFIXES = ['# CollectRnaSeqMetrics', '# Started on:']
          def body(payload):
              return '\\n'.join(l for l in payload.split('\\n')
                                if not any(l.startswith(p) for p in PREFIXES))
          def parse(path, open_fn=open):
              d = {}
              for line in open_fn(path):
                  parts = line.rstrip('\n').split('\t', 2)
                  if len(parts) < 3:
                      continue
                  d[(parts[0], parts[1])] = body(parts[2])
              return d
          real = parse('/tmp/rnaseq_real.txt')
          committed = parse('crates/picard-analysis/tests/data/rnaseq_metrics.txt.gz',
                            lambda p: gzip.open(p, 'rt'))
          if set(real) != set(committed):
              print("row sets differ:", sorted(set(real) ^ set(committed)))
              sys.exit(1)
          bad = [k for k in real if real[k] != committed[k]]
          print(f"compared={len(real)} mismatches={len(bad)}")
          for k in bad[:5]:
              print(f"  {k}\n    real={real[k][:200]}\n    committed={committed[k][:200]}")
          sys.exit(1 if bad else 0)
          PY

      - name: Regenerate the CollectQualityYieldMetricsSNVQ goldens
