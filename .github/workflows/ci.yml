name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: LICENSE and README state the same licence
        # picard-rs is MIT because Picard is MIT. gatk-rs is Apache 2.0. Getting these crossed
        # is easy and consequential, so it is checked rather than remembered.
        run: |
          grep -q "MIT License" LICENSE || { echo "LICENSE is not MIT"; exit 1; }
          grep -q "MIT, matching Picard" README.md || { echo "README licence claim changed"; exit 1; }
          grep -qi "not the official Picard" README.md || { echo "attribution notice missing"; exit 1; }
          echo "licence and attribution consistent"

      - name: Goldens live in exactly one place
        # They were committed twice, under tools/metrics-conformance/ and under the crate's
        # tests/data/, with nothing keeping the two in sync. A corpus that exists twice is a
        # corpus that can disagree with itself, and the CI comparison would have kept passing
        # against the stale copy.
        run: |
          strays=$(ls tools/metrics-conformance/*.txt.gz 2>/dev/null || true)
          if [ -n "$strays" ]; then
            echo "goldens duplicated outside crates/picard-analysis/tests/data:"
            echo "$strays"
            exit 1
          fi
          echo "one copy of each golden"

      - name: The workflow matches the conformance manifest
        # The oracle jobs are generated from tools/conformance/manifest.json. Editing the YAML by
        # hand is how the old file grew to 1556 lines of drifted copies of one comparator, so a
        # hand edit fails here instead of surviving unnoticed.
        run: python3 tools/conformance/generate_ci.py --check

      - name: Every committed golden belongs to a declared suite
        # A golden that no suite regenerates is a golden nothing checks: it can only ever be
        # compared against itself. Thirteen of them were in exactly that state before the manifest
        # existed (docs/decisions/0008), so the condition is now an invariant rather than a habit.
        run: python3 tools/conformance/audit_goldens.py

  determinism:
    name: "Determinism: same input, different environment"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build the pinned oracle image
        run: docker build --platform linux/amd64 -t picard-rs-oracle:3.4.0 tools/oracle

      - run: cargo build --release --bin collect-alignment-summary-metrics --bin add-oa-tag

      - name: Build the fixture corpus
        run: |
          mkdir -p target/fixtures
          docker run --rm --platform linux/amd64 -v "$PWD/tools/coverage":/harness:ro \
            -v "$PWD/target/fixtures":/out -w /work picard-rs-oracle:3.4.0 \
            'cp /harness/MakeFixtures.java . && javac -cp "$ORACLE_CP" -d . MakeFixtures.java \
             && java -Dsamjdk.try_use_intel_deflater=false -cp ".:$ORACLE_CP" MakeFixtures /out'

      - name: The same input twice, under three environments, is the same bytes
        # A byte-identity claim that only holds in one environment is not a byte-identity claim.
        # LC_ALL is the interesting one: htsjdk-rs decision 0011 established that metrics number
        # formatting is locale-dependent in the reference, and the oracle pins en_US for that
        # reason. The port must not have acquired the same dependency, so it is run under fr_FR,
        # where a locale-sensitive formatter would write "0,333333".
        run: |
          set -eux
          B=target/release/collect-alignment-summary-metrics
          F=target/fixtures
          $B I=$F/small.bam O=/tmp/run1.txt R=$F/ref.fasta
          $B I=$F/small.bam O=/tmp/run2.txt R=$F/ref.fasta
          TMPDIR=/tmp/other-tmp LC_ALL=fr_FR.UTF-8 $B I=$F/small.bam O=/tmp/run3.txt R=$F/ref.fasta
          mkdir -p /tmp/other-tmp
          JAVA_TOOL_OPTIONS=-Xmx256m $B I=$F/small.bam O=/tmp/run4.txt R=$F/ref.fasta
          for f in /tmp/run2.txt /tmp/run3.txt /tmp/run4.txt; do
            diff <(grep -v '^# ' /tmp/run1.txt) <(grep -v '^# ' $f) \
              || { echo "the port is not deterministic across environments: $f"; exit 1; }
          done
          echo "four runs, three environments, identical"

  fuzz:
    name: "Coverage-guided fuzzing of the reference"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build the pinned oracle image
        run: docker build --platform linux/amd64 -t picard-rs-oracle:3.4.0 tools/oracle

      - run: cargo build --release --bin collect-alignment-summary-metrics

      - name: Fuzz, seeded from the covering array, and replay against the port
        # The covering arrays cover interactions between arguments; they say nothing about which
        # branches of the reference those interactions reach. This starts from the array's rows and
        # keeps whatever reaches a probe nothing has reached. A short session on every run, because
        # the value is the regression signal (a divergence class that disappears, or a new one that
        # appears), not the depth of any single run.
        run: |
          python3 tools/fuzz/run_fuzz.py --tool CollectQualityYieldMetrics --iterations 60
          python3 tools/fuzz/run_fuzz.py --tool CollectAlignmentSummaryMetrics --iterations 60 \
            --port target/release/collect-alignment-summary-metrics

      - name: Publish the findings
        # Findings are evidence, not goldens: they say what the reference did and where the port
        # differs. They are published rather than committed, because a finding produced anywhere
        # other than real x86-64 CI cannot be quoted (decision 0008).
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: tools/fuzz/findings/
          if-no-files-found: ignore

  coverage:
    name: "Argument coverage: the covering array against both sides"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build the pinned oracle image
        run: docker build --platform linux/amd64 -t picard-rs-oracle:3.4.0 tools/oracle

      - run: cargo build --release --bin add-oa-tag --bin collect-alignment-summary-metrics --bin collect-quality-yield-metrics --bin sort-sam --bin clean-sam --bin sam-format-converter --bin bed-to-interval-list --bin interval-list-to-bed --bin normalize-fasta --bin add-or-replace-read-groups --bin merge-sam-files --bin replace-sam-header --bin calculate-read-group-checksum --bin non-n-fasta-size --bin scatter-intervals-by-ns --bin view-sam --bin bam-index-stats --bin reorder-sam --bin create-sequence-dictionary --bin downsample-sam --bin fix-mate-information --bin mean-quality-by-cycle --bin collect-base-distribution-by-cycle --bin quality-score-distribution --bin set-nm-md-and-uq-tags --bin revert-sam --bin extract-sequences

      - name: Run the arrays, and record what the port covers
        # Every row goes through the reference and through the port, compared under the same
        # canonicalization the conformance suites use. A rejected row counts as covered when both
        # sides reject it with the same message, because reproducing a refusal is reproducing the
        # tool.
        #
        # The number that comes out is not a bug count. It is how much of the pairwise argument
        # surface the port implements, which is the figure the programme had never had until this
        # job ran: a binary written for one path answers a row that varies another path
        # differently, and that difference is the measurement, not a failure.
        run: |
          python3 tools/coverage/run_array.py --tool AddOATag --t 2 \
            --port target/release/add-oa-tag \
            | tee /tmp/AddOATag.log
          python3 tools/coverage/run_array.py --tool CollectAlignmentSummaryMetrics --t 2 \
            --port target/release/collect-alignment-summary-metrics \
            | tee /tmp/CollectAlignmentSummaryMetrics.log
          python3 tools/coverage/run_array.py --tool CollectQualityYieldMetrics --t 2 \
            --port target/release/collect-quality-yield-metrics \
            | tee /tmp/CollectQualityYieldMetrics.log
          python3 tools/coverage/run_array.py --tool SortSam --t 2 \
            --port target/release/sort-sam \
            | tee /tmp/SortSam.log
          python3 tools/coverage/run_array.py --tool CleanSam --t 2 \
            --port target/release/clean-sam \
            | tee /tmp/CleanSam.log
          python3 tools/coverage/run_array.py --tool SamFormatConverter --t 2 \
            --port target/release/sam-format-converter \
            | tee /tmp/SamFormatConverter.log
          python3 tools/coverage/run_array.py --tool BedToIntervalList --t 2 \
            --port target/release/bed-to-interval-list \
            | tee /tmp/BedToIntervalList.log
          python3 tools/coverage/run_array.py --tool IntervalListToBed --t 2 \
            --port target/release/interval-list-to-bed \
            | tee /tmp/IntervalListToBed.log
          python3 tools/coverage/run_array.py --tool NormalizeFasta --t 2 \
            --port target/release/normalize-fasta \
            | tee /tmp/NormalizeFasta.log
          python3 tools/coverage/run_array.py --tool AddOrReplaceReadGroups --t 2 \
            --port target/release/add-or-replace-read-groups \
            | tee /tmp/AddOrReplaceReadGroups.log
          python3 tools/coverage/run_array.py --tool MergeSamFiles --t 2 \
            --port target/release/merge-sam-files \
            | tee /tmp/MergeSamFiles.log
          python3 tools/coverage/run_array.py --tool ReplaceSamHeader --t 2 \
            --port target/release/replace-sam-header \
            | tee /tmp/ReplaceSamHeader.log
          python3 tools/coverage/run_array.py --tool CalculateReadGroupChecksum --t 2 \
            --port target/release/calculate-read-group-checksum \
            | tee /tmp/CalculateReadGroupChecksum.log
          python3 tools/coverage/run_array.py --tool NonNFastaSize --t 2 \
            --port target/release/non-n-fasta-size \
            | tee /tmp/NonNFastaSize.log
          python3 tools/coverage/run_array.py --tool ScatterIntervalsByNs --t 2 \
            --port target/release/scatter-intervals-by-ns \
            | tee /tmp/ScatterIntervalsByNs.log
          python3 tools/coverage/run_array.py --tool ViewSam --t 2 \
            --port target/release/view-sam --stdout \
            | tee /tmp/ViewSam.log
          python3 tools/coverage/run_array.py --tool BamIndexStats --t 2 \
            --port target/release/bam-index-stats --stdout \
            | tee /tmp/BamIndexStats.log
          python3 tools/coverage/run_array.py --tool ReorderSam --t 2 \
            --port target/release/reorder-sam \
            | tee /tmp/ReorderSam.log
          python3 tools/coverage/run_array.py --tool CreateSequenceDictionary --t 2 \
            --port target/release/create-sequence-dictionary \
            | tee /tmp/CreateSequenceDictionary.log
          python3 tools/coverage/run_array.py --tool DownsampleSam --t 2 \
            --port target/release/downsample-sam --strip-program-records \
            | tee /tmp/DownsampleSam.log
          python3 tools/coverage/run_array.py --tool FixMateInformation --t 2 \
            --port target/release/fix-mate-information \
            | tee /tmp/FixMateInformation.log
          python3 tools/coverage/run_array.py --tool MeanQualityByCycle --t 2 \
            --port target/release/mean-quality-by-cycle \
            | tee /tmp/MeanQualityByCycle.log
          python3 tools/coverage/run_array.py --tool CollectBaseDistributionByCycle --t 2 \
            --port target/release/collect-base-distribution-by-cycle \
            | tee /tmp/CollectBaseDistributionByCycle.log
          python3 tools/coverage/run_array.py --tool QualityScoreDistribution --t 2 \
            --port target/release/quality-score-distribution \
            | tee /tmp/QualityScoreDistribution.log
          python3 tools/coverage/run_array.py --tool SetNmMdAndUqTags --t 2 \
            --port target/release/set-nm-md-and-uq-tags \
            | tee /tmp/SetNmMdAndUqTags.log
          python3 tools/coverage/run_array.py --tool RevertSam --t 2 \
            --port target/release/revert-sam \
            | tee /tmp/RevertSam.log
          python3 tools/coverage/run_array.py --tool ExtractSequences --t 2 \
            --port target/release/extract-sequences \
            | tee /tmp/ExtractSequences.log
          python3 tools/coverage/measure.py --log /tmp/AddOATag.log \
            --log /tmp/CollectAlignmentSummaryMetrics.log \
            --log /tmp/CollectQualityYieldMetrics.log \
            --log /tmp/SortSam.log \
            --log /tmp/CleanSam.log \
            --log /tmp/SamFormatConverter.log \
            --log /tmp/BedToIntervalList.log \
            --log /tmp/IntervalListToBed.log \
            --log /tmp/NormalizeFasta.log \
            --log /tmp/AddOrReplaceReadGroups.log \
            --log /tmp/MergeSamFiles.log \
            --log /tmp/ReplaceSamHeader.log \
            --log /tmp/CalculateReadGroupChecksum.log \
            --log /tmp/NonNFastaSize.log \
            --log /tmp/ScatterIntervalsByNs.log \
            --log /tmp/ViewSam.log \
            --log /tmp/BamIndexStats.log \
            --log /tmp/ReorderSam.log \
            --log /tmp/CreateSequenceDictionary.log \
            --log /tmp/DownsampleSam.log \
            --log /tmp/FixMateInformation.log \
            --log /tmp/MeanQualityByCycle.log \
            --log /tmp/CollectBaseDistributionByCycle.log \
            --log /tmp/QualityScoreDistribution.log \
            --log /tmp/SetNmMdAndUqTags.log \
            --log /tmp/RevertSam.log \
            --log /tmp/ExtractSequences.log \
            --out tools/coverage/measured.json \
            --pending-out tools/coverage/pending/measured.json

      - name: The committed measurement still holds
        # The corpus and the measurement are goldens like any other: produced here, committed, and
        # re-derived on every run. A port that grows its argument surface makes this fail, which is
        # the point, and the fix is to commit the new number.
        #
        # A `pending` tool is deliberately absent from both lists: its numbers exist only in the
        # log and the published artefact until someone commits them, exactly as a golden-pending
        # suite's golden does.
        run: |
          dirty=$(git status --porcelain tools/coverage/measured.json \
            tools/coverage/corpus/AddOATag.t2.txt \
            tools/coverage/corpus/CollectAlignmentSummaryMetrics.t2.txt \
            tools/coverage/corpus/CollectQualityYieldMetrics.t2.txt \
            tools/coverage/corpus/SortSam.t2.txt \
            tools/coverage/corpus/CleanSam.t2.txt \
            tools/coverage/corpus/SamFormatConverter.t2.txt \
            tools/coverage/corpus/BedToIntervalList.t2.txt \
            tools/coverage/corpus/IntervalListToBed.t2.txt \
            tools/coverage/corpus/NormalizeFasta.t2.txt \
            tools/coverage/corpus/AddOrReplaceReadGroups.t2.txt \
            tools/coverage/corpus/MergeSamFiles.t2.txt \
            tools/coverage/corpus/ReplaceSamHeader.t2.txt \
            tools/coverage/corpus/CalculateReadGroupChecksum.t2.txt \
            tools/coverage/corpus/NonNFastaSize.t2.txt \
            tools/coverage/corpus/ScatterIntervalsByNs.t2.txt \
            tools/coverage/corpus/ViewSam.t2.txt \
            tools/coverage/corpus/BamIndexStats.t2.txt \
            tools/coverage/corpus/ReorderSam.t2.txt \
            tools/coverage/corpus/CreateSequenceDictionary.t2.txt \
            tools/coverage/corpus/DownsampleSam.t2.txt \
            tools/coverage/corpus/FixMateInformation.t2.txt \
            tools/coverage/corpus/MeanQualityByCycle.t2.txt \
            tools/coverage/corpus/CollectBaseDistributionByCycle.t2.txt \
            tools/coverage/corpus/QualityScoreDistribution.t2.txt \
            tools/coverage/corpus/SetNmMdAndUqTags.t2.txt \
            tools/coverage/corpus/RevertSam.t2.txt \
            tools/coverage/corpus/ExtractSequences.t2.txt)
          if [ -n "$dirty" ]; then
            echo "the measured argument coverage moved:"
            echo "$dirty"
            git --no-pager diff -- tools/coverage/measured.json | head -40
            echo "commit the artefacts this run produced"
            exit 1
          fi
          echo "the committed measurement matches what this run produced"

      - name: Publish the corpus and the measurement
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: covering-corpus
          path: |
            tools/coverage/corpus/
            tools/coverage/measured.json
            tools/coverage/pending/
          if-no-files-found: ignore

  test:
    name: Test on real x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Every ported symbol comes from a licence-compatible source
        # htsjdk-rs decision 0014: a transcription of GPL2-only HotSpot source was published in
        # an MIT crate and found eleven commits later by reading module headers. The same guard
        # runs here before picard-rs ports a symbol whose source is not obviously in the pinned
        # clones.
        run: python3 tools/audit/provenance.py crates

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

      - name: htsjdk-rs is pinned by revision, not by branch
        # Picard's build.gradle pins htsjdkVersion. A floating dependency would let the I/O
        # layer change under a byte-identity claim without anything failing.
        run: |
          if grep -E 'htsjdk-[a-z]+ = \{ git' Cargo.toml | grep -qv 'rev = "'; then
            echo "an htsjdk-rs dependency is not pinned to a revision"
            exit 1
          fi
          grep -c 'rev = "' Cargo.toml

# The jobs below this line are generated from tools/conformance/manifest.json by
# tools/conformance/generate_ci.py. Edit the manifest, not this file: the `guard` job
# fails if the two disagree.
  oracle-image:
    name: Build the pinned oracle image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Record the host CPU
        run: grep -m1 'model name' /proc/cpuinfo; grep -m1 'vendor_id' /proc/cpuinfo

      - id: cache
        uses: actions/cache@v6
        with:
          path: /tmp/oracle-image.tar
          key: picard-rs-oracle-${{ hashFiles('tools/oracle/**') }}

      - name: Build the oracle image
        # The probe runs during the build, so a degraded environment cannot produce an image, let
        # alone a golden. The image is built once and shared with every suite below, because
        # rebuilding it per suite would multiply a five-minute build by the number of suites.
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build --platform linux/amd64 -t picard-rs-oracle:3.4.0 tools/oracle
          docker save picard-rs-oracle:3.4.0 -o /tmp/oracle-image.tar

  oracle:
    name: "oracle ${{ matrix.group }} ${{ matrix.index }}"
    needs: oracle-image
    runs-on: ubuntu-latest
    strategy:
      # One suite's divergence must not cancel the others: the point of the run is to learn which
      # suites diverge, not to learn that at least one does.
      fail-fast: false
      matrix:
        include:
          - group: oracle-backed
            index: "1/22"
            suites: "metrics rnaseq snvq samtofastq fastqtosam"
          - group: oracle-backed
            index: "2/22"
            suites: "sortsam addreplacerg cleansam fixmate addoatag"
          - group: oracle-backed
            index: "3/22"
            suites: "reordersam replacesamheader revertsam revertorigmatecigar viewsam"
          - group: oracle-backed
            index: "4/22"
            suites: "rgchecksum downsamplesam filtersamreads createdict samformatconverter"
          - group: oracle-backed
            index: "5/22"
            suites: "sortsam-bam setnmmduq addoatag-bam validatesam comparesams"
          - group: oracle-backed
            index: "6/22"
            suites: "split bamindexstats merge rejections qualityscoredistribution"
          - group: oracle-backed
            index: "7/22"
            suites: "gcbias accumulatequalityyield bedtointervallist intervallisttobed intervallisttools"
          - group: oracle-backed
            index: "8/22"
            suites: "intervallisttoolspadbreak liftoverintervallist extractsequences scatterintervalsbyns nonnfastasize"
          - group: oracle-backed
            index: "9/22"
            suites: "normalizefasta samtofastqwithtags mergebamalignment mergebamalignment-full mergebamalignment-header"
          - group: oracle-backed
            index: "10/22"
            suites: "mergebamalignment-pair mergebamalignment-clip mergebamalignment-hits jumpinglibrary comparemetrics"
          - group: oracle-backed
            index: "11/22"
            suites: "sortgff checkdupmarking qualityyieldflow vcfsamplenamemap haplotypedbtovcf"
          - group: oracle-backed
            index: "12/22"
            suites: "liftoverhaplotypemap positiondownsample duplicatemetrics verifyidintensity bafregress"
          - group: oracle-backed
            index: "13/22"
            suites: "wgsmetrics rawwgsmetrics umiprevalence artifacttooxog clustercrosscheck"
          - group: oracle-backed
            index: "14/22"
            suites: "extractfingerprint identifycontaminant mergepedintovcf accumulatevcm variantcallingmetrics"
          - group: oracle-backed
            index: "15/22"
            suites: "nonzerowgs oxog artifactmetrics hsmetrics pcrmetrics"
          - group: oracle-backed
            index: "16/22"
            suites: "libcomplexity genotypeconcordance multiplemetrics rrbsmetrics replicatemetrics"
          - group: oracle-backed
            index: "17/22"
            suites: "arraysmetrics combinearrays bamtobfq vcftoadpc markadapters"
          - group: oracle-backed
            index: "18/22"
            suites: "checkfingerprint markduplicates matecigarduplicates umiduplicates crosscheckfingerprints"
          - group: oracle-backed
            index: "19/22"
            suites: "fingerprintmetrics samerrormetrics checkilluminadirectory illuminalanemetrics extractilluminabarcodes"
          - group: oracle-backed
            index: "20/22"
            suites: "basecallstofastq basecallingmetrics basecallstosam pffailmetrics fifobuffer"
          - group: oracle-backed
            index: "21/22"
            suites: "liftovervcf mendelianviolations baitdesigner bpmtocsv comparegtc"
          - group: oracle-backed
            index: "22/22"
            suites: "gtctovcf createextendedmanifest"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: /tmp/oracle-image.tar
          key: picard-rs-oracle-${{ hashFiles('tools/oracle/**') }}
          fail-on-cache-miss: true

      - run: docker load -i /tmp/oracle-image.tar

      - name: Regenerate and compare
        # Every rule that canonicalizes anything away is declared in tools/conformance/manifest.json
        # with the reason it is there; tools/conformance/compare.py is the only code that applies
        # them. Run the same thing locally with:
        #   python3 tools/conformance/run_suite.py --suites "${{ matrix.suites }}"
        run: python3 tools/conformance/run_suite.py --suites "${{ matrix.suites }}"

      - name: Publish any candidate goldens
        # A `golden-pending` suite has no golden to compare against, and one may not be committed
        # from a developer machine (decision 0008). The job publishes what the pinned container
        # produced on real x86-64; committing that artefact is what makes the suite oracle-backed.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: candidate-goldens-${{ matrix.group }}-${{ strategy.job-index }}
          path: tools/conformance/pending/
          if-no-files-found: ignore

  oracle-probes:
    name: "probe: ${{ matrix.probe }}"
    needs: oracle-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - probe: rnaseq-overlap-order
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: /tmp/oracle-image.tar
          key: picard-rs-oracle-${{ hashFiles('tools/oracle/**') }}
          fail-on-cache-miss: true

      - run: docker load -i /tmp/oracle-image.tar

      - name: Run the probe
        # OverlapDetector in htsjdk-rs skips a byte-exact IntervalTree because the overlap set
        # is folded commutatively by this Picard tool. The probe belongs here, not in htsjdk-rs,
        # because it instantiates CollectRnaSeqMetrics and only the Picard oracle has it. Two
        # runs differ iff the HashSet<Gene> order reaches the output; identical means it does
        # not.
        run: python3 tools/conformance/run_suite.py --probe ${{ matrix.probe }}


  benchmark:
    name: "Throughput against Picard, on real x86-64"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build the pinned oracle image
        run: docker build -t picard-rs-oracle:3.4.0 tools/oracle

      - name: Generate the benchmark corpus
        run: |
          mkdir -p target/benchmark
          docker run --rm -v "$PWD/tools/benchmark":/harness:ro \
            -v "$PWD/target/benchmark":/out -w /work picard-rs-oracle:3.4.0 \
            'cp /harness/MakeBenchmarkBam.java . && javac -cp $PICARD_JAR -d . MakeBenchmarkBam.java \
             && java -cp .:$PICARD_JAR MakeBenchmarkBam 2000000 /out/bench'
          ls -la target/benchmark/bench.bam

      - name: Build the port
        run: cargo build --release --bin collect-alignment-summary-metrics --bin add-oa-tag

      - name: Time both, on the same hardware, neither emulated
        # The runner is real x86-64, so this is the authoritative figure; the numbers in
        # decision 0004 come from an emulated container and say so.
        run: |
          cp target/release/collect-alignment-summary-metrics target/benchmark/
          cat > target/benchmark/bench.sh <<'INNER'
          cd /out
          TIMEFORMAT='%3R'
          echo "jvm_startup_floor_s"
          for i in 1 2; do { time java -jar $PICARD_JAR CollectAlignmentSummaryMetrics --version >/dev/null 2>&1 ; } 2>&1; done
          echo "picard_gkl_default_s"
          for i in 1 2 3; do { time java -jar $PICARD_JAR CollectAlignmentSummaryMetrics I=bench.bam O=/out/picard.txt R=bench.fasta >/dev/null 2>&1 ; } 2>&1; done
          echo "rust_s"
          for i in 1 2 3; do { time /out/collect-alignment-summary-metrics I=bench.bam O=/out/rust.txt R=bench.fasta >/dev/null 2>&1 ; } 2>&1; done
          echo "rust_phases"
          PICARD_RS_TIMING=1 /out/collect-alignment-summary-metrics I=bench.bam O=/out/rust.txt R=bench.fasta
          INNER
          docker run --rm -v "$PWD/target/benchmark":/out -w /out picard-rs-oracle:3.4.0 'bash /out/bench.sh'

      - name: The fast output is also the identical output
        # A throughput number for output that does not match is worthless, so the two are
        # asserted in the same job rather than in separate ones that could drift.
        run: |
          python3 - <<'PY'
          import sys
          def body(path):
              return ''.join(l for l in open(path)
                             if not l.startswith('# CollectAlignmentSummaryMetrics')
                             and not l.startswith('# Started on:'))
          picard = body('target/benchmark/picard.txt')
          rust = body('target/benchmark/rust.txt')
          print("byte-identical over 2,000,000 reads:", picard == rust)
          if picard != rust:
              for i, (a, b) in enumerate(zip(picard.split('\n'), rust.split('\n'))):
                  if a != b:
                      print(f"line {i}\n  picard: {a[:200]}\n  ours  : {b[:200]}")
                      break
              sys.exit(1)
          PY

      - name: "Multicore: time AddOATag, single thread vs all cores vs Picard"
        # The metrics collector's fold is serial (float non-associativity, decision 0005). AddOATag
        # is a pure per-record transform, so it fans across cores; this measures that. rust_1t pins
        # RAYON_NUM_THREADS=1 to expose the single-thread floor, rust_nt leaves rayon on all cores,
        # and the gap between them is the multicore win, isolated from the Rust-vs-JVM baseline.
        run: |
          cp target/release/add-oa-tag target/benchmark/
          cat > target/benchmark/oabench.sh <<'INNER'
          cd /out
          TIMEFORMAT='%3R'
          echo "picard_addoatag_s"
          for i in 1 2 3; do { time java -jar $PICARD_JAR AddOATag I=bench.bam O=/out/picard_oa.sam VALIDATION_STRINGENCY=SILENT >/dev/null 2>&1 ; } 2>&1; done
          echo "rust_1t_s"
          for i in 1 2 3; do { time env RAYON_NUM_THREADS=1 /out/add-oa-tag I=bench.bam O=/out/rust_oa.sam >/dev/null 2>&1 ; } 2>&1; done
          echo "rust_nt_s"
          for i in 1 2 3; do { time /out/add-oa-tag I=bench.bam O=/out/rust_oa.sam >/dev/null 2>&1 ; } 2>&1; done
          # The whole-program numbers above are I/O-bound; these phase lines isolate the transform
          # itself, where the add_oa step is the only thing rayon parallelizes. Compare add_oa across
          # the two: that ratio is the multicore speedup on the work, before decode/encode/write dilute
          # it end to end.
          echo "rust_1t_phases"
          PICARD_RS_TIMING=1 RAYON_NUM_THREADS=1 /out/add-oa-tag I=bench.bam O=/out/rust_oa.sam
          echo "rust_nt_phases"
          PICARD_RS_TIMING=1 /out/add-oa-tag I=bench.bam O=/out/rust_oa.sam
          INNER
          docker run --rm -v "$PWD/target/benchmark":/out -w /out picard-rs-oracle:3.4.0 'bash /out/oabench.sh'

      - name: The parallel AddOATag output is byte-identical to Picard
        # AddOATag adds no @PG and no timestamp and preserves the coordinate order, so the whole SAM
        # is compared raw over the 2,000,000-read benchmark.
        run: |
          python3 - <<'PY'
          import sys
          picard = open('target/benchmark/picard_oa.sam', 'rb').read()
          rust = open('target/benchmark/rust_oa.sam', 'rb').read()
          print("AddOATag byte-identical over 2,000,000 reads:", picard == rust)
          if picard != rust:
              pl, rl = picard.split(b'\n'), rust.split(b'\n')
              for i, (a, b) in enumerate(zip(pl, rl)):
                  if a != b:
                      print(f"line {i}\n  picard: {a[:200]}\n  ours  : {b[:200]}")
                      break
              print(f"lines: picard={len(pl)} rust={len(rl)}")
              sys.exit(1)
          PY

  ci:
    name: CI complete
    # The single context main's ruleset requires, and the single context an automatic merge waits
    # on. It runs whatever the jobs above did, because a gate that is skipped when something fails
    # reports nothing and blocks nothing.
    needs:
      - guard
      - determinism
      - fuzz
      - coverage
      - test
      - oracle-image
      - oracle
      - oracle-probes
      - benchmark
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every job above succeeded
        # A skipped job is not a failure. A cancelled one is: a cancelled run has proved nothing,
        # and `success` on an empty result is how a green tick comes to mean less than it looks.
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["RESULTS"])
          bad = sorted(
              name for name, job in results.items()
              if job["result"] not in ("success", "skipped")
          )
          for name in bad:
              print(f"{name}: {results[name]['result']}")
          print(f"{len(results) - len(bad)}/{len(results)} jobs green")
          sys.exit(1 if bad else 0)
          PY
