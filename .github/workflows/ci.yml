name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LICENSE and README state the same licence
        # picard-rs is MIT because Picard is MIT. gatk-rs is Apache 2.0. Getting these crossed
        # is easy and consequential, so it is checked rather than remembered.
        run: |
          grep -q "MIT License" LICENSE || { echo "LICENSE is not MIT"; exit 1; }
          grep -q "MIT, matching Picard" README.md || { echo "README licence claim changed"; exit 1; }
          grep -qi "not the official Picard" README.md || { echo "attribution notice missing"; exit 1; }
          echo "licence and attribution consistent"

  test:
    name: Test on real x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

      - name: htsjdk-rs is pinned by revision, not by branch
        # Picard's build.gradle pins htsjdkVersion. A floating dependency would let the I/O
        # layer change under a byte-identity claim without anything failing.
        run: |
          if grep -E 'htsjdk-[a-z]+ = \{ git' Cargo.toml | grep -qv 'rev = "'; then
            echo "an htsjdk-rs dependency is not pinned to a revision"
            exit 1
          fi
          grep -c 'rev = "' Cargo.toml

  oracle:
    name: Regenerate the metrics goldens on real x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the host CPU
        run: grep -m1 'model name' /proc/cpuinfo; grep -m1 'vendor_id' /proc/cpuinfo

      - name: Build the oracle image
        # The probe runs during the build, so a degraded environment cannot produce an image.
        run: docker build --platform linux/amd64 -t picard-rs-oracle:3.4.0 tools/oracle

      - name: Regenerate the CollectQualityYieldMetrics goldens
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/tools/metrics-conformance":/harness:ro -w /work picard-rs-oracle:3.4.0 \
            'cp /harness/QualityYieldDump.java . && javac -cp "$ORACLE_CP" -d . QualityYieldDump.java \
             && java -cp ".:$ORACLE_CP" QualityYieldDump 2>/dev/null' > /tmp/qy_real.txt
          wc -l /tmp/qy_real.txt

      - name: Regenerate the CollectInsertSizeMetrics goldens
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD/tools/metrics-conformance":/harness:ro -w /work picard-rs-oracle:3.4.0 \
            'cp /harness/InsertSizeDump.java . && javac -cp "$ORACLE_CP" -d . InsertSizeDump.java \
             && java -cp ".:$ORACLE_CP" InsertSizeDump 2>/dev/null' > /tmp/is_real.txt
          wc -l /tmp/is_real.txt

      - name: Compare the metrics rows against the committed goldens
        # The BAM hex and the metrics header lines carry JVM-chosen temp paths and a timestamp,
        # so only the metrics body is comparable across runs. That is stated here rather than
        # left implicit, because a comparison that quietly ignores most of a file is worthless.
        run: |
          python3 - <<'PY'
          import sys, gzip, re
          def body(text, prefix):
              # Drop the two header lines whose content is chosen at run time.
              keep = [l for l in text.split('\\n')
                      if not l.startswith(prefix) and not l.startswith('# Started on:')]
              return '\\n'.join(keep)
          def parse(path, open_fn=open, prefix=''):
              d = {}
              for line in open_fn(path):
                  parts = line.rstrip('\n').split('\t', 2)
                  if len(parts) < 3 or parts[0] != 'metrics': continue
                  d[parts[1]] = body(parts[2], prefix)
              return d
          bad, total = [], 0
          for real_path, committed_path, prefix in [
                  ('/tmp/qy_real.txt', 'tools/metrics-conformance/quality_yield.txt.gz',
                   '# CollectQualityYieldMetrics'),
                  ('/tmp/is_real.txt', 'tools/metrics-conformance/insert_size.txt.gz',
                   '# CollectInsertSizeMetrics')]:
              real = parse(real_path, prefix=prefix)
              committed = parse(committed_path, lambda p: gzip.open(p, 'rt'), prefix=prefix)
              if set(real) != set(committed):
                  print(f"case sets differ in {real_path}: {sorted(set(real) ^ set(committed))}")
                  sys.exit(1)
              total += len(real)
              bad += [(real_path, k) for k in real if real[k] != committed[k]]
          print(f"compared={total} mismatches={len(bad)}")
          for k in bad[:5]:
              print(f"  {k}\n    real={real[k][:200]}\n    committed={committed[k][:200]}")
          sys.exit(1 if bad else 0)
          PY
