name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LICENSE and README state the same licence
        # picard-rs is MIT because Picard is MIT. gatk-rs is Apache 2.0. Getting these crossed
        # is easy and consequential, so it is checked rather than remembered.
        run: |
          grep -q "MIT License" LICENSE || { echo "LICENSE is not MIT"; exit 1; }
          grep -q "MIT, matching Picard" README.md || { echo "README licence claim changed"; exit 1; }
          grep -qi "not the official Picard" README.md || { echo "attribution notice missing"; exit 1; }
          echo "licence and attribution consistent"

      - name: Goldens live in exactly one place
        # They were committed twice, under tools/metrics-conformance/ and under the crate's
        # tests/data/, with nothing keeping the two in sync. A corpus that exists twice is a
        # corpus that can disagree with itself, and the CI comparison would have kept passing
        # against the stale copy.
        run: |
          strays=$(ls tools/metrics-conformance/*.txt.gz 2>/dev/null || true)
          if [ -n "$strays" ]; then
            echo "goldens duplicated outside crates/picard-analysis/tests/data:"
            echo "$strays"
            exit 1
          fi
          echo "one copy of each golden"

      - name: The workflow matches the conformance manifest
        # The oracle jobs are generated from tools/conformance/manifest.json. Editing the YAML by
        # hand is how the old file grew to 1556 lines of drifted copies of one comparator, so a
        # hand edit fails here instead of surviving unnoticed.
        run: python3 tools/conformance/generate_ci.py --check

      - name: Every committed golden belongs to a declared suite
        # A golden that no suite regenerates is a golden nothing checks: it can only ever be
        # compared against itself. Thirteen of them were in exactly that state before the manifest
        # existed (docs/decisions/0008), so the condition is now an invariant rather than a habit.
        run: python3 tools/conformance/audit_goldens.py

  test:
    name: Test on real x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Every ported symbol comes from a licence-compatible source
        # htsjdk-rs decision 0014: a transcription of GPL2-only HotSpot source was published in
        # an MIT crate and found eleven commits later by reading module headers. The same guard
        # runs here before picard-rs ports a symbol whose source is not obviously in the pinned
        # clones.
        run: python3 tools/audit/provenance.py crates

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

      - name: htsjdk-rs is pinned by revision, not by branch
        # Picard's build.gradle pins htsjdkVersion. A floating dependency would let the I/O
        # layer change under a byte-identity claim without anything failing.
        run: |
          if grep -E 'htsjdk-[a-z]+ = \{ git' Cargo.toml | grep -qv 'rev = "'; then
            echo "an htsjdk-rs dependency is not pinned to a revision"
            exit 1
          fi
          grep -c 'rev = "' Cargo.toml

# {{ORACLE_JOBS}}

  benchmark:
    name: "Throughput against Picard, on real x86-64"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build the pinned oracle image
        run: docker build -t picard-rs-oracle:3.4.0 tools/oracle

      - name: Generate the benchmark corpus
        run: |
          mkdir -p target/benchmark
          docker run --rm -v "$PWD/tools/benchmark":/harness:ro \
            -v "$PWD/target/benchmark":/out -w /work picard-rs-oracle:3.4.0 \
            'cp /harness/MakeBenchmarkBam.java . && javac -cp $PICARD_JAR -d . MakeBenchmarkBam.java \
             && java -cp .:$PICARD_JAR MakeBenchmarkBam 2000000 /out/bench'
          ls -la target/benchmark/bench.bam

      - name: Build the port
        run: cargo build --release --bin collect-alignment-summary-metrics --bin add-oa-tag

      - name: Time both, on the same hardware, neither emulated
        # The runner is real x86-64, so this is the authoritative figure; the numbers in
        # decision 0004 come from an emulated container and say so.
        run: |
          cp target/release/collect-alignment-summary-metrics target/benchmark/
          cat > target/benchmark/bench.sh <<'INNER'
          cd /out
          TIMEFORMAT='%3R'
          echo "jvm_startup_floor_s"
          for i in 1 2; do { time java -jar $PICARD_JAR CollectAlignmentSummaryMetrics --version >/dev/null 2>&1 ; } 2>&1; done
          echo "picard_gkl_default_s"
          for i in 1 2 3; do { time java -jar $PICARD_JAR CollectAlignmentSummaryMetrics I=bench.bam O=/out/picard.txt R=bench.fasta >/dev/null 2>&1 ; } 2>&1; done
          echo "rust_s"
          for i in 1 2 3; do { time /out/collect-alignment-summary-metrics I=bench.bam O=/out/rust.txt R=bench.fasta >/dev/null 2>&1 ; } 2>&1; done
          echo "rust_phases"
          PICARD_RS_TIMING=1 /out/collect-alignment-summary-metrics I=bench.bam O=/out/rust.txt R=bench.fasta
          INNER
          docker run --rm -v "$PWD/target/benchmark":/out -w /out picard-rs-oracle:3.4.0 'bash /out/bench.sh'

      - name: The fast output is also the identical output
        # A throughput number for output that does not match is worthless, so the two are
        # asserted in the same job rather than in separate ones that could drift.
        run: |
          python3 - <<'PY'
          import sys
          def body(path):
              return ''.join(l for l in open(path)
                             if not l.startswith('# CollectAlignmentSummaryMetrics')
                             and not l.startswith('# Started on:'))
          picard = body('target/benchmark/picard.txt')
          rust = body('target/benchmark/rust.txt')
          print("byte-identical over 2,000,000 reads:", picard == rust)
          if picard != rust:
              for i, (a, b) in enumerate(zip(picard.split('\n'), rust.split('\n'))):
                  if a != b:
                      print(f"line {i}\n  picard: {a[:200]}\n  ours  : {b[:200]}")
                      break
              sys.exit(1)
          PY

      - name: "Multicore: time AddOATag, single thread vs all cores vs Picard"
        # The metrics collector's fold is serial (float non-associativity, decision 0005). AddOATag
        # is a pure per-record transform, so it fans across cores; this measures that. rust_1t pins
        # RAYON_NUM_THREADS=1 to expose the single-thread floor, rust_nt leaves rayon on all cores,
        # and the gap between them is the multicore win, isolated from the Rust-vs-JVM baseline.
        run: |
          cp target/release/add-oa-tag target/benchmark/
          cat > target/benchmark/oabench.sh <<'INNER'
          cd /out
          TIMEFORMAT='%3R'
          echo "picard_addoatag_s"
          for i in 1 2 3; do { time java -jar $PICARD_JAR AddOATag I=bench.bam O=/out/picard_oa.sam VALIDATION_STRINGENCY=SILENT >/dev/null 2>&1 ; } 2>&1; done
          echo "rust_1t_s"
          for i in 1 2 3; do { time env RAYON_NUM_THREADS=1 /out/add-oa-tag I=bench.bam O=/out/rust_oa.sam >/dev/null 2>&1 ; } 2>&1; done
          echo "rust_nt_s"
          for i in 1 2 3; do { time /out/add-oa-tag I=bench.bam O=/out/rust_oa.sam >/dev/null 2>&1 ; } 2>&1; done
          # The whole-program numbers above are I/O-bound; these phase lines isolate the transform
          # itself, where the add_oa step is the only thing rayon parallelizes. Compare add_oa across
          # the two: that ratio is the multicore speedup on the work, before decode/encode/write dilute
          # it end to end.
          echo "rust_1t_phases"
          PICARD_RS_TIMING=1 RAYON_NUM_THREADS=1 /out/add-oa-tag I=bench.bam O=/out/rust_oa.sam
          echo "rust_nt_phases"
          PICARD_RS_TIMING=1 /out/add-oa-tag I=bench.bam O=/out/rust_oa.sam
          INNER
          docker run --rm -v "$PWD/target/benchmark":/out -w /out picard-rs-oracle:3.4.0 'bash /out/oabench.sh'

      - name: The parallel AddOATag output is byte-identical to Picard
        # AddOATag adds no @PG and no timestamp and preserves the coordinate order, so the whole SAM
        # is compared raw over the 2,000,000-read benchmark.
        run: |
          python3 - <<'PY'
          import sys
          picard = open('target/benchmark/picard_oa.sam', 'rb').read()
          rust = open('target/benchmark/rust_oa.sam', 'rb').read()
          print("AddOATag byte-identical over 2,000,000 reads:", picard == rust)
          if picard != rust:
              pl, rl = picard.split(b'\n'), rust.split(b'\n')
              for i, (a, b) in enumerate(zip(pl, rl)):
                  if a != b:
                      print(f"line {i}\n  picard: {a[:200]}\n  ours  : {b[:200]}")
                      break
              print(f"lines: picard={len(pl)} rust={len(rl)}")
              sys.exit(1)
          PY
